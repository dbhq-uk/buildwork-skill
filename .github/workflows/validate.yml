name: Validate

on:
  push:
  pull_request:

# The default for every job below. A job that needs more declares it itself;
# an explicit floor here means a new job cannot silently inherit an org
# setting somebody widened.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No `version` in plugin.json, on purpose (24 Sep 2026). Claude Code only
      # updates an installed plugin when this field changes, it was never bumped,
      # and marketplace installs sat on old code for weeks. With no version the
      # commit is the version, so every merge to main reaches users.
      - name: plugin.json carries no version
        run: jq -e 'has("version") | not' .claude-plugin/plugin.json > /dev/null

      - name: Installers are valid bash
        run: bash -n install.sh install-codex.sh

      - name: Plugin manifest is valid JSON
        run: jq empty .claude-plugin/plugin.json

      - name: SKILL.md has name and description frontmatter
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          ok = True
          for skill in sorted(pathlib.Path("skills").glob("*/SKILL.md")):
              text = skill.read_text(encoding="utf-8")
              match = re.match(r"^---\n(.*?)\n---", text, re.S)
              if not match:
                  print(f"{skill}: no frontmatter")
                  ok = False
                  continue
              for key in ("name:", "description:"):
                  if key not in match.group(1):
                      print(f"{skill}: missing {key}")
                      ok = False
          sys.exit(0 if ok else 1)
          PY

      - name: No absolute skill paths, which break plugin and Codex installs
        run: |
          if grep -rIn '~/.claude/skills/buildwork\|/home/' --include='SKILL.md' skills/ ; then
            echo "SKILL.md must reach its scripts through \${CLAUDE_SKILL_DIR}."
            exit 1
          fi

      # Claude Code substitutes only the braced `${CLAUDE_SKILL_DIR}`. The
      # unbraced form is left for the shell, where the variable is not set, so
      # every command would run as `/scripts/buildwork.py` and fail. A literal
      # `$CLAUDE_SKILL_DIR` never occurs inside the braced form, so a
      # fixed-string match is enough.
      - name: Skill paths use the braced form Claude Code substitutes
        run: |
          if grep -rnF '$CLAUDE_SKILL_DIR' --include='*.md' skills/ ; then
            echo "Write \${CLAUDE_SKILL_DIR} with braces. Claude Code does not substitute the unbraced form."
            exit 1
          fi

      - name: No merge verb reached the scripts
        run: |
          if grep -rInE 'gh pr merge|git merge |git push .*(main|master)|--admin' skills/buildwork/scripts/ ; then
            echo "buildwork never merges. See constraint 1 in AGENTS.md."
            exit 1
          fi

      - name: No em dashes, which the house style forbids
        run: |
          if grep -rIn $'—' --include='*.md' --include='*.py' . ; then
            echo "Em dash found. Use a comma, a full stop, a semicolon or brackets."
            exit 1
          fi

      - name: Nothing client-specific reached this public repository
        run: |
          if grep -rInE '[0-9]{1,3}(\.[0-9]{1,3}){3}|[A-Z]{3,}-[0-9]{3,}|dev\.azure\.com/[A-Za-z]' \
               --include='*.md' --include='*.py' --include='*.yml' \
               --exclude-dir=.github . ; then
            echo "That looks like an IP address, a ticket id, or a real organisation. Check it."
            exit 1
          fi

      - name: Tests
        run: |
          python3 -m pip install --quiet pytest
          python3 -m pytest skills/buildwork/tests -q

  # THE SAME TWO LINTERS IN EVERY DBHQ SKILL REPO, added 17 Sep 2026. Nine of
  # the fourteen ran no linter at all, in an estate that is mostly bash and
  # Python - so a shell quoting hazard or a name that does not exist was only
  # caught by somebody reading the diff.
  #
  # IT IS A DELIBERATELY NARROW RUFF SELECTION. `E9` is syntax errors and
  # `F` is the pyflakes set: undefined names, unused imports, f-strings with no
  # placeholders. Those are bugs. The full default selection flags import order
  # and whitespace across every one of these repos, which would have meant
  # reformatting thousands of lines in code other sessions are working in
  # before the gate could go green - a large diff to buy a gate that catches
  # less than this one does. garmin and imager run the full ruff and keep it.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: shellcheck
        # -S warning, not the default, because `info` and `style` fire on
        # idioms these scripts use deliberately. xargs -r so a repo with no
        # shell scripts is a pass rather than a shellcheck usage error.
        run: |
          find . -name '*.sh' -not -path '*/.venv/*' -print0 \
            | xargs -0 -r shellcheck -S warning

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5
        with:
          python-version: "3.11"

      - name: ruff - syntax errors and undefined names
        run: |
          pip install --quiet ruff
          ruff check . --select E9,F --exclude .venv
